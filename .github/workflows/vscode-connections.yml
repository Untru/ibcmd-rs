name: VSCode connections
on:
  pull_request:
    paths:
      [
        "examples/form_field_map_observer.rs",
        "tools/write-form-observer-provenance.py",
        "editors/vscode/**",
        "src/**",
        "crates/**",
        "Cargo.toml",
        "Cargo.lock",
        "tests/**",
        ".github/workflows/vscode-connections.yml",
        ".github/workflows/release.yml",
      ]
  push:
    paths:
      [
        "examples/form_field_map_observer.rs",
        "tools/write-form-observer-provenance.py",
        "editors/vscode/**",
        "src/**",
        "crates/**",
        "Cargo.toml",
        "Cargo.lock",
        "tests/**",
        ".github/workflows/vscode-connections.yml",
        ".github/workflows/release.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo test --locked --test editor_server --test editor_export_plan --no-default-features
      - name: Test bounded Form field-map observer
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
          IBCMD_TEST_KEEP_FIXTURES: "1"
        run: |
          cargo test --locked --lib field_map_observer --no-default-features
          cargo test --locked --lib query_identity_observer --no-default-features
          cargo test --locked -p ibcmd-form-schema --lib form_observer_shared_schema_tests
      - name: Test explicit chart series-name policy
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
          IBCMD_TEST_KEEP_FIXTURES: "1"
        run: |
          cargo test --locked -p ibcmd-moxel chart_policy_
          cargo test --locked -p ibcmd-moxel explicit_english_projection_
          cargo test --locked --lib chart_policy_ --no-default-features
          cargo test --locked --lib explicit_english_projection_ --no-default-features
          cargo test --locked --lib chart_series_names_ --no-default-features
          cargo test --locked --lib changed_chart_names_ --no-default-features
          cargo test --locked --lib nonstored_chart_labels_ --no-default-features

      - name: Build read-only Windows Form observer
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build --locked --no-default-features --example form_field_map_observer
      - name: Verify Windows observer CLI non-disclosure and bounds
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tests/scripts/form_field_map_observer_cli_test.py target/debug/examples/form_field_map_observer.exe "$env:RUNNER_TEMP/observer-fixtures"
      - name: Verify frozen context CLI custody and non-disclosure
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          IBCMD_TEST_KEEP_FIXTURES: "1"
        run: python tests/scripts/form_field_map_context_cli_test.py target/debug/examples/form_field_map_observer.exe "$env:RUNNER_TEMP/observer-context-fixtures"
      - name: Verify observer staging preserves prior artifacts
        env:
          IBCMD_TEST_KEEP_FIXTURES: "1"
        run: python tests/scripts/form_observer_provenance_test.py "${{ runner.temp }}/observer-provenance-fixtures"
      - name: Bind Windows observer artifact provenance
        id: observer_artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DIAGNOSTIC_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $observerArtifactDirectory = Join-Path $env:RUNNER_TEMP ("form-observer-artifact-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          python tools/write-form-observer-provenance.py target/debug/examples/form_field_map_observer.exe "$observerArtifactDirectory"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "directory=$observerArtifactDirectory" >> $env:GITHUB_OUTPUT
      - name: Retain reviewed observer for serialized lab diagnostics
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: form-field-map-observer-windows-x64
          path: ${{ steps.observer_artifact.outputs.directory }}/
          if-no-files-found: error
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run bundle
        working-directory: editors/vscode
      - run: npm run test:package
        working-directory: editors/vscode
      - run: npm run format:check
        working-directory: editors/vscode
      - name: Unit and real CLI/RPC integration tests
        shell: bash
        run: |
          export IBCMD_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/ibcmd-rs"
          if [ "$RUNNER_OS" = Windows ]; then export IBCMD_TEST_BINARY="$IBCMD_TEST_BINARY.exe"; fi
          npm test
        working-directory: editors/vscode
      - name: Extension-host interactions, real offline connection and synthetic failures
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export IBCMD_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/ibcmd-rs"
          export IBCMD_TEST_ROOT="$RUNNER_TEMP/ibcmd-vscode-host"
          export IBCMD_TEST_ROWS="${TMPDIR:-/tmp}/ibcmd-external-editor-server-protocol/rows/demo"
          xvfb-run -a npm run test:host
          xvfb-run -a npm run test:tree-host
          xvfb-run -a npm run test:source-host
        working-directory: editors/vscode
      - name: Build Windows platform VSIX
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: editors/vscode
        run: |
          cargo build --locked --release --no-default-features --manifest-path ../../Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Binary build failed' }
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          python scripts/package.py --target win32-x64 --binary ../../target/release/ibcmd-rs.exe --out ../../target/vsix/ibcmd-rs-win32-x64.vsix
          if ($LASTEXITCODE -ne 0) { throw 'VSIX packaging failed' }
          python scripts/package.py --target win32-x64 --binary ../../target/release/ibcmd-rs.exe --out ../../target/vsix/repeated.vsix
          if ($LASTEXITCODE -ne 0) { throw 'Repeated VSIX packaging failed' }
          if ((Get-FileHash ../../target/vsix/ibcmd-rs-win32-x64.vsix).Hash -ne (Get-FileHash ../../target/vsix/repeated.vsix).Hash) { throw 'Non-reproducible VSIX' }
      - name: Install packaged Windows extension in clean editor and verify offline tree
        timeout-minutes: 15
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: editors/vscode
        run: |
          $env:IBCMD_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'ibcmd-installed-host'
          $env:IBCMD_TEST_VSIX = Join-Path $env:GITHUB_WORKSPACE 'target/vsix/ibcmd-rs-win32-x64.vsix'
          $env:IBCMD_TEST_ROWS = Join-Path ([System.IO.Path]::GetTempPath()) 'ibcmd-external-editor-server-protocol/rows/demo'
          npm run test:installed
          if ($LASTEXITCODE -ne 0) { throw 'Installed extension acceptance failed' }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: vscode-win32-x64
          path: |
            target/vsix/ibcmd-rs-win32-x64.vsix
            target/vsix/ibcmd-rs-win32-x64.vsix.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: vscode-installed-acceptance
          path: |
            ${{ runner.temp }}/ibcmd-installed-host/**/acceptance.json
            ${{ runner.temp }}/ibcmd-installed-host/**/phases.jsonl
            ${{ runner.temp }}/ibcmd-installed-host/**/user-data/logs/**
          if-no-files-found: warn
      - name: Export commands in a real isolated editor host
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export IBCMD_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/ibcmd-rs"
          export IBCMD_TEST_ROOT="$RUNNER_TEMP/ibcmd-export-host"
          export IBCMD_TEST_ROWS="${TMPDIR:-/tmp}/ibcmd-external-editor-server-protocol/rows/demo"
          export IBCMD_TEST_SUITE="export-host-suite.js"
          xvfb-run -a npm run test:host
        working-directory: editors/vscode
