name: Offline E2E

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-e2e-${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a pull request's run; a run of master finishes,
  # so every merged commit gets a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  OPENSPEC_TELEMETRY: "0"
  RUST_VERSION: "1.95.0"
  # Test builds keep line tables only: full debug info made the debug
  # executable ~700 MB and linking dominated the test steps.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  spec:
    name: OpenSpec (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate the accepted design and specifications
        env:
          CI: "true"
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
        run: |
          npx --yes @fission-ai/openspec@1.6.0 validate extract-coverage-corpus --strict --no-interactive
          npx --yes @fission-ai/openspec@1.6.0 validate add-coverage-configuration --strict --no-interactive
          npx --yes @fission-ai/openspec@1.6.0 validate build-offline-converter --strict --no-interactive
          npx --yes @fission-ai/openspec@1.6.0 validate add-fast-parity-evidence --strict --no-interactive
          npx --yes @fission-ai/openspec@1.6.0 validate add-selected-cf-extract --strict --no-interactive
          npx --yes @fission-ai/openspec@1.6.0 validate implement-edt-project-conversion --strict --no-interactive
          npx --yes @fission-ai/openspec@1.6.0 validate add-issue-self-service --strict --no-interactive
          npx --yes @fission-ai/openspec@1.6.0 validate enable-extension-apply-851150 --strict --no-interactive
          npx --yes @fission-ai/openspec@1.6.0 validate add-extension-restructuring --strict --no-interactive

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Enforce EDT-derived corpus governance
        shell: pwsh
        run: |
          ./tools/validate-edt-corpus.ps1 -RepositoryRoot . -SelfTest
          ./tools/validate-edt-corpus.ps1 -RepositoryRoot .

      - name: Enforce physical-adapter policy guard
        shell: pwsh
        run: |
          ./tools/validate-physical-adapter-policy.ps1 -RepositoryRoot .
          ./tools/validate-physical-adapter-policy.ps1 -RepositoryRoot . -SelfTest

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test the lane selection of the offline matrix
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/scripts/test_ci_scope.py

      - name: Lint standalone workspace crates offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo clippy --locked --workspace --exclude ibcmd-rs --all-targets -- -D warnings

  offline-matrix:
    name: Offline matrix (${{ matrix.name }})
    needs: [spec, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: target/release/ibcmd-rs
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/release/ibcmd-rs.exe
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/release/ibcmd-rs
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            binary: target/release/ibcmd-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          # The base of a pull request, for the lane selection below.
          fetch-depth: 0

      - name: Select a physical temporary directory
        shell: pwsh
        run: |
          $physicalTemp = Join-Path $env:RUNNER_TEMP 'ibcmd-physical-tmp'
          New-Item -ItemType Directory -Force -Path $physicalTemp | Out-Null
          foreach ($name in @('TEMP', 'TMP', 'TMPDIR')) {
            "$name=$physicalTemp" >> $env:GITHUB_ENV
          }

      - name: Enforce EDT-derived corpus governance
        shell: pwsh
        run: |
          ./tools/validate-edt-corpus.ps1 -RepositoryRoot . -SelfTest
          ./tools/validate-edt-corpus.ps1 -RepositoryRoot .

      - name: Test EDT corpus governance under Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $pester = Get-Module -ListAvailable Pester |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if ($null -eq $pester) {
            throw 'Pester is required for the Windows PowerShell governance test.'
          }
          Import-Module $pester.Path
          if ($pester.Version.Major -ge 5) {
            $result = Invoke-Pester -Path tests/scripts/validate-edt-corpus.Tests.ps1 -PassThru
          } else {
            $result = Invoke-Pester -Script tests/scripts/validate-edt-corpus.Tests.ps1 -PassThru
          }
          if ($result.FailedCount -ne 0) {
            exit 1
          }

      - name: Enforce physical-adapter policy guard
        shell: pwsh
        run: |
          ./tools/validate-physical-adapter-policy.ps1 -RepositoryRoot .
          ./tools/validate-physical-adapter-policy.ps1 -RepositoryRoot . -SelfTest

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A pull request runs only the lanes its changed files can affect
      # (scripts/ci_scope.py); pushes and manual runs run every lane. The
      # job itself always runs, so the required checks always report.
      - name: Select the lanes this change needs
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python scripts/ci_scope.py --base "origin/${{ github.base_ref }}" | tee -a "$GITHUB_OUTPUT"
          else
            python scripts/ci_scope.py --all | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Test installed-EDT oracle guards without the platform
        shell: pwsh
        run: |
          python tests/scripts/edt_oracle_test.py
          if ($LASTEXITCODE -ne 0) { throw 'edt_oracle_test failed' }
          python tests/scripts/xml_to_edt_macos_test.py
          if ($LASTEXITCODE -ne 0) { throw 'xml_to_edt_macos_test failed' }
          python tests/scripts/edt_warm_context_test.py
          if ($LASTEXITCODE -ne 0) { throw 'edt_warm_context_test failed' }
          python tests/scripts/edt_release_audit_test.py
          if ($LASTEXITCODE -ne 0) { throw 'edt_release_audit_test failed' }
          python tests/scripts/linux_abi_test.py
          if ($LASTEXITCODE -ne 0) { throw 'linux_abi_test failed' }
          python tests/scripts/test_sql_capture_null_guards.py
          if ($LASTEXITCODE -ne 0) { throw 'test_sql_capture_null_guards failed' }
          ./tools/package-windows-root-lib-test.ps1 -SelfTest
          python tools/coverage/fixture_paths.py
          if ($LASTEXITCODE -ne 0) { throw 'pinned fixtures validation failed' }
          python -m unittest discover -s tests/fixtures/1c-fixtures/tools/coverage -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'native generator tests failed' }
          python -m unittest discover -s tools/coverage -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'coverage generator tests failed' }

      - name: Cache Cargo artifacts
        if: steps.scope.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # Native dependency objects must not cross runner ABI boundaries.
          key: abi-v1-${{ matrix.os }}-${{ matrix.target }}

      - name: Fetch locked dependencies
        if: steps.scope.outputs.rust == 'true'
        run: cargo fetch --locked

      - name: Validate bundled schema corpus
        if: steps.scope.outputs.crates == 'true'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked -p ibcmd-schema

      - name: Lint standalone workspace crates on Windows
        if: steps.scope.outputs.rust == 'true' && runner.os == 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo clippy --locked --workspace --exclude ibcmd-rs --all-targets -- -D warnings

      - name: Test standalone workspace crates offline
        if: steps.scope.outputs.crates == 'true'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked --workspace --exclude ibcmd-rs

      - name: Test root integration suites offline
        if: steps.scope.outputs.rust == 'true'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked -p ibcmd-rs --test '*' --no-default-features

      # Every unit test of the root library (the converters and the load and
      # export engines). Their paths are built portably, so all five targets
      # run them.
      - name: Test the root library offline
        if: steps.scope.outputs.lib == 'true'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked -p ibcmd-rs --lib --no-default-features

      # Reuse the Windows lib-test build for sole-operator disposable SQL gates.
      # Ignored tests are packaged here, never executed against a database in CI.
      - name: Package Windows root lib test
        if: steps.scope.outputs.lib == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          ./tools/package-windows-root-lib-test.ps1 -RepositoryRoot . -OutputDirectory (Join-Path $env:RUNNER_TEMP 'windows-root-lib-test')

      - name: Upload Windows root lib test
        if: steps.scope.outputs.lib == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-root-lib-test-${{ github.sha }}
          path: ${{ runner.temp }}/windows-root-lib-test/
          if-no-files-found: error
          retention-days: 3

      # Every test removes what it creates in the temporary directory, also
      # when it fails (docs/testing.md, "Temporary directories"). Kept on
      # purpose: the two editor-server corpora the VS Code tests read by name
      # (`ibcmd-external-editor-server-protocol`, `-export`), and `ibcmd-rs`,
      # the parent the engine's scratch folders share, when it is empty.
      - name: Check that the tests left the temporary directory empty
        if: steps.scope.outputs.crates == 'true' || steps.scope.outputs.rust == 'true' || steps.scope.outputs.lib == 'true'
        # Not pwsh: the .NET runtime keeps its own pipes in TMPDIR while it runs.
        shell: python
        run: |
          import os, sys
          root = os.environ["TMPDIR"]
          def kept(name):
              path = os.path.join(root, name)
              if name in ("ibcmd-external-editor-server-protocol", "ibcmd-external-editor-server-export"):
                  return True
              return name == "ibcmd-rs" and os.path.isdir(path) and not os.listdir(path)
          left = sorted(name for name in os.listdir(root) if not kept(name))
          for name in left:
              print(f"left in {root}: {name}")
          if left:
              sys.exit(f"{len(left)} entries left in the temporary directory; a test must remove what it creates")
          print(f"the temporary directory {root} holds nothing unexpected")

      - name: Retain binary for failed release boundary investigation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-boundary-binary-${{ matrix.target }}
          path: |
            target/debug/ibcmd-rs
            target/debug/ibcmd-rs.exe
          if-no-files-found: ignore
          retention-days: 3

      - name: Build the release-shaped binary offline
        if: steps.scope.outputs.rust == 'true'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo build --locked --release --no-default-features

      - name: Verify Ubuntu 22.04 GLIBC compatibility
        if: steps.scope.outputs.rust == 'true' && runner.os == 'Linux'
        run: python scripts/audit_linux_abi.py --binary ${{ matrix.binary }} --target ${{ matrix.target }} --output target/offline-evidence/${{ matrix.target }}.abi.json

      - name: Verify native micro-corpus parity offline
        if: steps.scope.outputs.rust == 'true'
        shell: pwsh
        run: ./tools/verify-native-evidence.ps1 -RepositoryRoot . -BinaryPath ${{ matrix.binary }}

      - name: Generate deterministic runtime SBOM
        if: steps.scope.outputs.rust == 'true'
        env:
          CARGO_NET_OFFLINE: "true"
        run: python scripts/generate_sbom.py --manifest-path Cargo.toml --output target/offline-evidence/${{ matrix.target }}.sbom.cdx.json --target ${{ matrix.target }}

      - name: Audit clean-environment release boundary
        if: steps.scope.outputs.rust == 'true'
        run: python scripts/audit_release.py --binary ${{ matrix.binary }} --sbom target/offline-evidence/${{ matrix.target }}.sbom.cdx.json

      - name: Package and audit the exact tested binary
        if: steps.scope.outputs.rust == 'true'
        shell: pwsh
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])"
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          $stem = "target/offline-evidence/ibcmd-rs-$version-${{ matrix.target }}"
          $sbom = "target/offline-evidence/${{ matrix.target }}.sbom.cdx.json"
          python scripts/package_release.py --binary ${{ matrix.binary }} --sbom $sbom --output "$stem.zip" --version $version --target ${{ matrix.target }} --repository-root .
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed' }
          python scripts/audit_release.py --binary ${{ matrix.binary }} --sbom $sbom --archive "$stem.zip" --checksum "$stem.zip.sha256"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged release audit failed' }

      - name: Upload evidence
        if: steps.scope.outputs.rust == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: offline-evidence-${{ matrix.target }}
          path: target/offline-evidence/*
          if-no-files-found: error
          retention-days: 14
