name: CI

on:
  push:
    branches:
      - master
  pull_request:
    # Documents and the editor client change no compiled target here.
    paths-ignore:
      - 'editors/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a pull request's run; a run of master finishes,
  # so every merged commit gets a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  platform-evidence-harness:
    name: Platform evidence harness
    runs-on: ubuntu-latest
    env:
      IBCMD_TEST_KEEP_FIXTURES: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Test exact-build evidence audit
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/scripts/platform_acceptance_test.py -v

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Only master writes caches; pull requests restore master's.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check formatting
        run: cargo fmt --all --check

  legacy-windows:
    name: Legacy Root (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Only master writes caches; pull requests restore master's.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check legacy root targets with explicit platform oracle
        run: cargo check --locked -p ibcmd-rs --all-targets --features platform-oracle

      - name: Compile legacy root test harness with explicit platform oracle
        run: cargo test --locked -p ibcmd-rs --no-run --features platform-oracle
