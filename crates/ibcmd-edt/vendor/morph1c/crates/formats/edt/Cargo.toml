[package]
workspace = "../../.."
name = "formats-edt"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "EDT (.mdo source) connector: Reader/Writer for 1C metadata descriptors. Mirror layout per ARCHITECTURE.md §5; drives core::engine via the shared formats-xml substrate; byte-exact .mdo regeneration (§3.2)."

[lib]
name = "formats_edt"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Canonical IR + spec + engine. The connector frames object identity and drives
# core::engine::{read,write} over common_module(); it never hand-decodes (§1.6).
morph1c-core = { path = "../../core" }
# Shared XML projection substrate (locus/codec + tokenizer + byte-exact emitter) +
# the harness-registry type (`FormatKind` / `Format` / `CorpusLayout`). The per-format
# `FORMAT_KINDS` array is generated by build.rs from `src/metadata/*.rs` (DCE-safe).
formats-xml = { path = "../../formats-xml" }

