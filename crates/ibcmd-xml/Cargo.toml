[package]
name = "ibcmd-xml"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
ibcmd-core = { path = "../ibcmd-core" }
ibcmd-schema = { path = "../ibcmd-schema" }
quick-xml = "0.38.4"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
renamore = "=0.3.2"
